[project]
name = "nunspark"
version = "0.0.1"
description = "Streaming inference for oversized LLMs on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.31.0",
    "mlx-lm>=0.31.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
nunspark = "nunspark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nunspark"]

[tool.hatch.build.targets.wheel.force-include]
"src/nunspark/webapp/static" = "nunspark/webapp/static"
